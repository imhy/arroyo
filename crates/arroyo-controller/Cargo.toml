[package]
name = "arroyo-controller"
version = "0.16.0-dev"
edition = "2024"

[features]
default = []

[dependencies]
arroyo-types = { path = "../arroyo-types" }
arroyo-datastream = { path = "../arroyo-datastream" }
arroyo-rpc = { path = "../arroyo-rpc" }
arroyo-state = { path = "../arroyo-state" }
# The candidate half of M11.D39d writes an object before any row names it, so the controller
# needs the store directly rather than only through `arroyo-state`'s checkpoint surface.
arroyo-storage = { path = "../arroyo-storage" }
arroyo-server-common = { path = "../arroyo-server-common" }
arroyo-worker = { path = "../arroyo-worker" }
arroyo-state-protocol = { path = "../arroyo-state-protocol" }
tonic = {workspace = true}

prost = {workspace = true}
tokio = { workspace = true }
tokio-stream = { workspace = true }
rand = { workspace = true }
petgraph = {workspace = true, features = ["serde-1"]}
prometheus = {workspace = true}
async-trait = { workspace = true }
lazy_static = { workspace = true }

serde = { workspace = true }

anyhow = { workspace = true }

# Kubernetes
kube = { version = "0.99", features = ["runtime", "derive"] }
k8s-openapi = { workspace = true, features = ["v1_30"] }
shlex = "1.3"

figment = { version = "0.10", features = ["json"] }

# json-schema support
serde_json = { workspace = true }

# logging
tracing = { workspace = true }

# SQL
postgres-types = { version = "*", features = ["derive"] }
tokio-postgres = { workspace = true }
futures = { workspace = true }
time = "0.3"
cornucopia_async = { workspace = true, features = ["with-serde_json-1"] }
thiserror = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true, features = ["serde_json", "time"] }

[build-dependencies]
cornucopia = { workspace = true }
postgres = "0.19.5"
arroyo-types = { path = "../arroyo-types" }
rusqlite = { workspace = true }
refinery = { version = "0.8.14", features = ["rusqlite"] }

[dev-dependencies]
# The same migration runner `build.rs` uses, so the fence/epoch query tests execute against
# the schema the SQLite migrations actually produce rather than against a fixture that
# mirrors it. A hand-written fixture cannot fail when a migration's default changes.
refinery = { version = "0.8.14", features = ["rusqlite"] }
# The other arm of `cornucopia_async::DatabaseSource`. The fixtures above are SQLite, whose
# `client()` cannot fail; a pool pointed at a port nothing listens on is the only way to reach
# the arm that turns "the database could not be reached" into a retryable authority error rather
# than a lost fence duel. The version is the workspace's, which is the one cornucopia resolves to.
deadpool-postgres = { workspace = true }
